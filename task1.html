<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="stylesheet" href="assets/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="train-page">
  <main class="train-card">
    <header class="train-header"><h1>Book a train ticket</h1></header>
    <form action="submitted.html" method="get" class="train-form">
      <fieldset class="mb-4">
        <legend class="visually-hidden">Trip type</legend>
        <div class="btn-group trip-toggle" role="group" aria-label="Trip type">
          <input class="btn-check" type="radio" name="trip" id="one-way" value="one-way" checked>
          <label class="btn" for="one-way">One way</label>
          <input class="btn-check" type="radio" name="trip" id="round-trip" value="round-trip">
          <label class="btn" for="round-trip">Round trip</label>
        </div>
      </fieldset>
      <div class="row g-3 g-md-4 mb-4">
        <div class="col-12 col-md-6"><div class="form-floating">
          <input class="form-control" type="text" id="from" name="from" placeholder="Astana" required>
          <label for="from">From</label>
        </div></div>
        <div class="col-12 col-md-6"><div class="form-floating">
          <input class="form-control" type="text" id="to" name="to" placeholder="Almaty" required>
          <label for="to">To</label>
        </div></div>
      </div>
      <div class="row g-3 g-md-4 mb-4">
        <div class="col-12 col-md-4">
          <label class="form-label" for="departure">Departure</label>
          <input class="form-control" type="date" id="departure" name="departure" required>
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label" for="return">Return</label>
          <input class="form-control" type="date" id="return" name="return">
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label" for="passengers">Passengers</label>
          <select class="form-select" id="passengers" name="passengers">
            <option value="1">1 adult</option><option value="2">2 adults</option>
            <option value="3">3 adults</option><option value="4">4 adults</option>
            <option value="5">5 adults</option><option value="6">6 adults</option>
          </select>
        </div>
      </div>
      <fieldset class="mb-4">
        <legend class="form-label">Carriage class</legend>
        <div class="carriage-options">
          <div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="seat" name="carriage" value="seat" required><label class="form-check-label" for="seat">Seat</label></div>
          <div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="coupe" name="carriage" value="coupe" required><label class="form-check-label" for="coupe">Coupé</label></div>
          <div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="sleeper" name="carriage" value="sleeper" required><label class="form-check-label" for="sleeper">Sleeper</label></div>
        </div>
      </fieldset>
      <div class="row g-3 g-md-4 mb-4">
        <div class="col-12 col-md-6">
          <label class="form-label" for="phone">Phone</label>
          <div class="input-group"><span class="input-group-text" id="phone-prefix">+7</span><input class="form-control" type="tel" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel" aria-describedby="phone-prefix" required></div>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>
      </div>
      <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes"><label class="form-check-label" for="sms">Also send the ticket by SMS</label></div>
      <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="agreement" name="agreement" value="yes" required><label class="form-check-label" for="agreement">I agree with the carriage rules</label></div>
      <!-- CSS reverses the buttons on phones; their HTML order stays the same. -->
      <div class="train-actions"><button class="btn btn-clear" type="reset">Clear</button><button class="btn btn-find" type="submit">Find trains</button></div>
    </form>
  </main>
</body>
</html>
