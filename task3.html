<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserve a table</title>
  <link rel="stylesheet" href="assets/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="assignment-shell">
    <h1>Reserve a table</h1>
    <p class="required-note">Fields marked * are required.</p>
    <form action="submitted.html" method="get">
      <div class="row g-3 mb-3">
        <div class="col-12 col-md-6">
          <label class="form-label" for="full-name">Your name *</label>
          <input class="form-control" type="text" id="full-name" name="full_name" autocomplete="name" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="email">Email *</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="phone">Phone *</label>
          <input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel" required>
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label" for="guests">Guests *</label>
          <input class="form-control" type="number" id="guests" name="guests" min="1" step="1" required>
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label" for="date">Date *</label>
          <input class="form-control" type="date" id="date" name="date" required>
        </div>
      </div>
      <fieldset class="mb-3">
        <legend>Seating *</legend>
        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="inside" name="seating" value="inside" required><label class="form-check-label" for="inside">Inside</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="terrace" name="seating" value="terrace" required><label class="form-check-label" for="terrace">Terrace</label></div>
      </fieldset>
      <div class="mb-3">
        <label class="form-label" for="meal">Meal *</label>
        <select class="form-select" id="meal" name="meal" required><option value="">Choose a meal</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="comments">Comments <span class="fw-normal">(optional)</span></label>
        <textarea class="form-control" id="comments" name="comments" rows="3" aria-describedby="comments-help"></textarea>
        <div class="form-text" id="comments-help">Let us know about seating requests or dietary needs.</div>
      </div>
      <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" name="terms" value="accepted" required><label class="form-check-label" for="terms">I agree to the terms *</label></div>
      <button class="btn btn-primary px-4 py-2" type="submit">Reserve</button>
    </form>
  </main>
</body>
</html>
